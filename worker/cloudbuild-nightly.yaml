steps:
  # 1. Build fresh worker container with latest cm CLI
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/worker:latest'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/worker:$BUILD_ID'
      - './worker'

  # 2. Push updated image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/worker'

  # 3. Update Cloud Run Job template with the fresh image
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - '$_JOB_NAME'
      - '--region=$_REGION'
      - '--image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/worker:latest'

substitutions:
  _REGION: 'us-west1'
  _AR_REPO: 'codemender-workers'
  _JOB_NAME: 'codemender-worker'

images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/worker:latest'
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/worker:$BUILD_ID'
